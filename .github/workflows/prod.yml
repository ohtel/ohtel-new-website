name: prod Build, Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - prod 
env:
  CODE_DIR: /home/ubuntu/docker/frontend/app/code
  STACK_FILE: /home/ubuntu/docker/frontend/docker-compose.yml
jobs:
  build:
    name: Build
    runs-on: ohtel-new-web
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rsync latest code
        run: sudo rsync -avz ./ $CODE_DIR --delete
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.15.0'
 
      - name: Build container 
        run: sudo docker-compose -f $STACK_FILE build
 
      - name: Save Docker Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /home/ubuntu/docker/frontend/app/Dockerfile
  deploy:
    name: Deploy
    runs-on: ohtel-new-web
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.15.0'
 
      - name: deploy container
        run: |
          # Deploy a docker container.
          echo "Deploying new container..."
          sudo docker-compose -f $STACK_FILE up -d
          sudo docker exec proxy_server nginx -s reload
